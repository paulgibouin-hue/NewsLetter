name: Tech Daily Newsletter

on:
  schedule:
    - cron: "0 7 * * *"  # tous les jours à 7h UTC — ajuste selon ton fuseau
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis GitHub

permissions:
  contents: write  # nécessaire pour que le workflow puisse commit/push l'archive

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer la newsletter
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py 2>&1 | tee run_output.log

      # --- TEMPORAIRE : debug d'un échec persistant, à retirer une fois corrigé ---
      - name: Dump du log d'erreur (debug temporaire)
        if: failure()
        run: |
          git config user.name "debug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f run_output.log
          git commit -m "debug: dump erreur run ${{ github.run_id }}"
          git push

      - name: Diagnostic sortie complète (debug temporaire)
        if: always()
        run: |
          python3 -c "
          content = open('run_output.log', encoding='utf-8', errors='replace').read()
          lines = content.splitlines()[-40:]
          escaped = chr(10).join(lines).replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::notice title=Diagnostic run_output.log (40 dernieres lignes)::{escaped}')
          "
      # --- fin bloc temporaire ---

      - name: Commit et push de l'archive
        run: |
          git config user.name "tech-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ published_links.json
          git commit -m "Newsletter du $(date +'%Y-%m-%d')" || echo "Rien à commit"
          git push
